# Конфигурация производительности для телеграм бота HSE

# Настройки базы данных
database:
  # Пул соединений
  pool_size: 20
  max_overflow: 30
  pool_timeout: 30
  pool_recycle: 3600
  
  # Оптимизации запросов
  echo: false
  echo_pool: false
  
  # Настройки для высокой нагрузки
  pool_pre_ping: true
  pool_reset_on_return: "commit"

# Настройки Redis
redis:
  # Пул соединений
  max_connections: 50
  retry_on_timeout: true
  socket_timeout: 5
  socket_connect_timeout: 5
  
  # Настройки кеширования
  default_timeout: 3600
  key_prefix: "hse_bot:"

# Настройки уведомлений
notifications:
  # Батчинг
  batch_size: 50
  max_concurrent_batches: 5
  
  # Rate limiting
  rate_limit_per_second: 25  # Меньше лимита Telegram (30/сек)
  burst_limit: 100
  
  # Retry настройки
  max_retries: 3
  retry_delays: [1, 5, 15]  # секунды
  
  # Таймауты
  send_timeout: 30
  batch_timeout: 300

# Настройки планировщика
scheduler:
  # Интервалы выполнения задач
  sync_deadlines_interval: 1800  # 30 минут
  check_notifications_interval: 900  # 15 минут
  cleanup_interval: 86400  # 24 часа
  health_check_interval: 300  # 5 минут
  
  # Настройки выполнения
  max_instances: 1
  coalesce: true
  misfire_grace_time: 60

# Настройки логирования
logging:
  # Уровни для производительности
  performance_mode: true
  
  # Ротация логов
  max_file_size: "100MB"
  backup_count: 10
  
  # Буферизация
  buffer_size: 8192
  flush_interval: 5

# Мониторинг производительности
monitoring:
  # Метрики
  collect_metrics: true
  metrics_interval: 60
  
  # Пороги предупреждений
  cpu_warning_threshold: 80
  memory_warning_threshold: 500  # MB
  db_response_warning_threshold: 100  # ms
  
  # Автоматические действия
  auto_cleanup_enabled: true
  auto_restart_on_memory_leak: false

# Оптимизации для 800 пользователей
scalability:
  # Предполагаемая нагрузка
  max_users: 800
  avg_subscriptions_per_user: 3
  avg_notifications_per_day: 2400
  
  # Настройки кеширования
  cache_user_settings: true
  cache_subscriptions: true
  cache_deadlines: true
  cache_ttl: 1800  # 30 минут
  
  # Предварительная загрузка
  preload_active_users: true
  preload_upcoming_deadlines: true
  
  # Оптимизации запросов
  use_bulk_operations: true
  batch_db_operations: true
  lazy_loading: true

# Настройки памяти
memory:
  # Лимиты
  max_memory_usage: 1024  # MB
  warning_threshold: 512  # MB
  
  # Очистка
  gc_threshold: 700  # MB
  force_gc_interval: 3600  # секунды
  
  # Оптимизации
  object_pooling: true
  string_interning: true

# Настройки сети
network:
  # Таймауты
  connect_timeout: 10
  read_timeout: 30
  total_timeout: 60
  
  # Retry настройки
  max_retries: 3
  backoff_factor: 0.3
  
  # Keep-alive
  keep_alive: true
  keep_alive_timeout: 30

# Настройки безопасности для производительности
security:
  # Rate limiting для пользователей
  user_rate_limit: 10  # команд в минуту
  global_rate_limit: 1000  # команд в минуту
  
  # Защита от спама
  spam_detection: true
  max_identical_messages: 3
  spam_timeout: 300  # секунды

# Настройки разработки/отладки
development:
  # Профилирование
  enable_profiling: false
  profile_slow_queries: true
  slow_query_threshold: 1.0  # секунды
  
  # Отладка
  debug_mode: false
  verbose_logging: false
  
  # Тестирование
  mock_external_apis: false
  simulate_delays: false