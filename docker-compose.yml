version: '3.8'

networks:
  hse_bot_network:

volumes:
  postgres_data:

services:
  db:
    image: postgres:15-alpine
    container_name: hse_bot_db
    restart: unless-stopped
    env_file:
      - src/config/.env  # Переменные окружения для БД
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hse_bot_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - hse_bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hse_bot_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ALEMBIC_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}

      - ENVIRONMENT=${ENVIRONMENT:-production}
      - TZ=${TZ:-Europe/Moscow}
    env_file:
      - src/config/.env
    volumes:
      - ./logs:/app/logs
      - ./src/config/creds.json:/app/src/config/creds.json:ro
    networks:
      - hse_bot_network