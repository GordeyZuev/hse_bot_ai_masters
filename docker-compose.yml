version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: hse_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hse_bot_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - hse_bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hse_bot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HSE Bot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hse_bot_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-hse_bot_db}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-hse_bot_db}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
    env_file:
      - src/config/.env
    volumes:
      - ./logs:/app/logs
      - ./src/config/creds.json:/app/config/creds.json:ro
    networks:
      - hse_bot_network
    command: ["python", "main.py", "full"]

  # Adminer (optional database management tool)
  adminer:
    image: adminer:latest
    container_name: hse_bot_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - hse_bot_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  hse_bot_network:
    driver: bridge