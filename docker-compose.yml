version: '3.8'

networks:
  hse_bot_network:

volumes:
  postgres_data:

services:
  db:
    image: postgres:15-alpine
    container_name: hse_bot_db
    restart: unless-stopped
    env_file:
      - src/config/.env  # Переменные окружения для БД
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - hse_bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: hse_bot_app:local
    command: ["uv", "run", "python", "main.py", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - ENVIRONMENT=${ENVIRONMENT:-production}
    env_file:
      - src/config/.env
    volumes:
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - hse_bot_network

  app:
    image: hse_bot_app:local
    container_name: hse_bot_app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - TZ=${TZ:-Europe/Moscow}
    env_file:
      - src/config/.env
    volumes:
      - ./logs:/app/logs
      - ./src/config/creds.json:/app/src/config/creds.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - hse_bot_network
